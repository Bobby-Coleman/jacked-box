name: Deploy website (GitHub Pages)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

# Publishable settings come from repository variables (Settings -> Secrets and variables ->
# Actions -> Variables). Unset ones are simply off (guest mode, no store links).
env:
  VITE_PUBLIC_URL: ${{ vars.VITE_PUBLIC_URL }}
  VITE_SUPPORT_EMAIL: ${{ vars.VITE_SUPPORT_EMAIL }}
  VITE_SUPPORT_URL: ${{ vars.VITE_SUPPORT_URL }}
  VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
  VITE_SUPABASE_ANON_KEY: ${{ vars.VITE_SUPABASE_ANON_KEY }}
  VITE_AUTH_APPLE: ${{ vars.VITE_AUTH_APPLE }}
  VITE_AUTH_GOOGLE: ${{ vars.VITE_AUTH_GOOGLE }}
  VITE_GOOGLE_WEB_CLIENT_ID: ${{ vars.VITE_GOOGLE_WEB_CLIENT_ID }}
  VITE_GOOGLE_IOS_CLIENT_ID: ${{ vars.VITE_GOOGLE_IOS_CLIENT_ID }}
  VITE_APP_STORE_URL: ${{ vars.VITE_APP_STORE_URL }}
  VITE_PLAY_STORE_URL: ${{ vars.VITE_PLAY_STORE_URL }}
  VITE_LIVE_VOICE: ${{ vars.VITE_LIVE_VOICE }}
  VITE_EARLY_ACCESS: ${{ vars.VITE_EARLY_ACCESS }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/sim.mjs "" 1
      - run: npx vite build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
