name: Android APK (debug)

# Wraps the web build in a Capacitor Android shell and builds an installable debug APK.
# Run it from the Actions tab ("Run workflow"); download the APK from the run's artifacts.
on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci --ignore-scripts
      - run: npx vite build
      - name: Add Capacitor Android shell
        run: |
          npm install --no-save @capacitor/core@8 @capacitor/cli@8 @capacitor/android@8
          npx cap add android
          mkdir -p assets && cp public/icon-store-1024.png assets/icon-only.png
          npx --yes @capacitor/assets@3 generate --android --iconBackgroundColor '#e23a2a' --splashBackgroundColor '#d9a466' || echo "icon generation skipped"
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: jacked-box-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 30
